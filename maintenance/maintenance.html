<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maintenance Mode - ICTS Dashboard</title>
  <style>
    :root {
      --uci-blue: #0064a4;
      --uci-gold: #ffd200;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: url("ICTS-background.jpeg") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 2rem 1rem 1rem;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
      color: var(--uci-blue);
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .card {
      background-color: white;
      border-radius: 12px;
      padding: 2rem;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    .card h2 {
      font-size: 2rem;
      color: var(--uci-gold);
      margin-bottom: 1rem;
    }

    .card p {
      font-size: 1.2rem;
      color: #333;
    }

    footer {
      text-align: center;
      background: #f0f2f5;
      padding: 1rem;
      border-top: 1px solid #ddd;
      font-size: 0.9rem;
      color: #555;
    }

    @media (max-width: 600px) {
      .card {
        padding: 1.5rem;
      }

      .card h2 {
        font-size: 1.6rem;
      }

      .card p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>UCI Institute for Clinical & Translational Science (ICTS)</h1>
  </header>

  <main>
    <div class="card">
      <h2>We'll be back soon!</h2>
      <p>
        The UCI ICTS Dashboard is currently undergoing scheduled maintenance.
        <br /><br />
        Expected return: 2025-07-28 09:22:07 AM PST
        <br /><br />
        Please check back shortly.
      </p>
    </div>
  </main>

  <footer>
    ©2024 UCI Institute for Clinical & Translational Science
  </footer>
</body>
</html>
