server {
    # Redirect HTTP to HTTPS
    listen 80;
    server_name genomics.icts.uci.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name genomics.icts.uci.edu;

    # SSL settings
    ssl_certificate           /etc/ssl/certs/icts8001_certificate.pem;
    ssl_certificate_key       /etc/ssl/private/icts8001_private.key;
    ssl_trusted_certificate   /etc/ssl/certs/icts8001_intermediate.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Serve maintenance assets directly
    location = /ICTS-background.jpeg {
        root /var/www/github/GREGor_dashboard/maintenance;
    }

    location = /maintenance.html {
        root /var/www/github/GREGor_dashboard/maintenance;
    }

    # Maintenance mode routing
    location / {
        if (-f /var/www/github/GREGor_dashboard/maintenance/maintenance.flag) {
            return 503;
        }

        root /var/www/github/GREGor_dashboard/client/build;
        index index.html;
        try_files $uri /index.html;
    }

    location /api/ {
        if (-f /var/www/github/GREGor_dashboard/maintenance/maintenance.flag) {
            return 503;
        }

        proxy_pass http://unix:/var/run/gregor.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static for Swagger/admin
    location /api/static/ {
        alias /var/www/github/GREGor_dashboard/server/static/;
        expires max;
    }

    location = /favicon.ico {
        root /var/www/github/GREGor_dashboard/client/build;
        access_log off;
        log_not_found off;
    }

    # Maintenance error page
    error_page 503 @maintenance;
    location @maintenance {
        root /var/www/github/GREGor_dashboard/maintenance;
        rewrite ^ /maintenance.html break;
    }

    # 404 fallback
    error_page 404 /index.html;
    location = /index.html {
        root /var/www/github/GREGor_dashboard/client/build;
    }
}
