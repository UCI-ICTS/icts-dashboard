<div id="g_id_onload"
     data-client_id="707343581069-oe3rocjvd5cjvb1jaajjtict9pofeql7.apps.googleusercontent.com"
     data-callback="handleCredentialResponse">
</div>
<div class="g_id_signin" data-type="standard"></div>

<pre id="token-output"></pre>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  function slugify(text) {
    return text.toString().toLowerCase()
      .replace(/\s+/g, '-')
      .replace(/[^\w\-]+/g, '')
      .replace(/--+/g, '-')
      .replace(/^-+/, '')
      .replace(/-+$/, '');
  }

  function storeAuthAndRedirect(accessToken) {
    const swaggerPath = '/api/swagger';
    const key = slugify(swaggerPath) + '-drf-yasg-auth';
    const authObj = {
      Bearer: {
        name: "Bearer",
        schema: { type: "apiKey", in: "header", name: "Authorization" },
        value: "Bearer " + accessToken
      }
    };
    localStorage.setItem(key, JSON.stringify(authObj));
    window.location.href = swaggerPath; // wherever your Swagger UI is served
  }

  function handleCredentialResponse(response) {
    fetch('/api/auth/oauth/google/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: response.credential })
    })
      .then(res => res.json())
      .then(data => {
        storeAuthAndRedirect(data.access);
      });
  }
</script>

<form id="login-form">
  <input type="text" id="username" placeholder="Username" required>
  <input type="password" id="password" placeholder="Password" required>
  <button type="submit">Log in</button>
</form>

<script>
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    fetch('/api/auth/token/login/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    })
      .then(res => res.json())
      .then(data => {
        storeAuthAndRedirect(data.access);
      });
  });
</script>
