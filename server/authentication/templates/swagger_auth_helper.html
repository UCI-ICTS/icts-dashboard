<div id="g_id_onload"
     data-client_id="707343581069-oe3rocjvd5cjvb1jaajjtict9pofeql7.apps.googleusercontent.com"
     data-callback="handleCredentialResponse">
</div>
<div class="g_id_signin" data-type="standard"></div>

<pre id="token-output"></pre>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  function handleCredentialResponse(response) {
    fetch('/api/auth/oauth/google/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: response.credential })
  })
    .then(res => res.json())
    .then(data => {
      sessionStorage.setItem('swagger_access_token', data.access);
      window.location.href = '/api/swagger/'; // wherever your Swagger UI is served
    });
}
</script>
<form id="login-form">
  <input type="text" id="username" placeholder="Username" required>
  <input type="password" id="password" placeholder="Password" required>
  <button type="submit">Log in</button>
</form>

<script>
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    fetch('/api/auth/token/login/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    })
      .then(res => res.json())
      .then(data => {
        sessionStorage.setItem('swagger_access_token', data.access);
        window.location.href = '/api/swagger';
      });
  });
</script>
